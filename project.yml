name: MarkdownEditor
options:
  bundleIdPrefix: com.markview
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

configs:
  Debug: debug
  Release: release

targets:
  MarkdownEditor:
    type: application
    platform: macOS
    sources:
      - path: MarkdownEditor
        excludes:
          - "**/*.entitlements"
    resources:
      - path: MarkdownEditor/Resources
    entitlements:
      path: MarkdownEditor/MarkdownEditor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markview.MarkdownEditor
        PRODUCT_NAME: MarkdownEditor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  MarkdownEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MarkdownEditorTests
    dependencies:
      - target: MarkdownEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markview.MarkdownEditorTests
